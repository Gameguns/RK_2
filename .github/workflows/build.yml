name: CI and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [created]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt update && sudo apt install -y cmake build-essential checkinstall
      - name: Build and test
        run: chmod +x build_and_test.sh && ./build_and_test.sh
      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: memento-package
          path: memento-pattern.deb

  release:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: memento-package
      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./memento-pattern.deb
          asset_name: memento-pattern.deb
          asset_content_type: application/vnd.debian.binary-package
